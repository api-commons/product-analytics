      summary: Delete a cohort
      tags:
      - Cohorts
      x-commons-tier: core
      x-commons-share: 0.643
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
    patch:
      operationId: updateCohort
      summary: Update a cohort
      tags:
