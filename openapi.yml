openapi: 3.1.0
info:
  title: Product Analytics (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Product Analytics interface, distilled from the harvested OpenAPI of 80 providers in
    the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /events:
    post:
      operationId: createEvent
      summary: Create an event
      tags:
      - Events
      x-commons-tier: core
      x-commons-share: 0.75
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Event'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
    get:
      operationId: listEvents
      summary: List events
      tags:
      - Events
      x-commons-tier: extended
      x-commons-share: 0.4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /events/{event_id}:
    parameters:
    - $ref: '#/components/parameters/event_id'
    get:
      operationId: getEvent
      summary: Get an event
      tags:
      - Events
      x-commons-tier: extended
      x-commons-share: 0.25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
  /profiles:
