        '200':
          description: OK
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
    get:
      operationId: listProfiles
      summary: List profiles
      tags:
      - Profiles
      x-commons-tier: extended
      x-commons-share: 0.4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id002
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /profiles/{profile_id}:
    parameters:
    - $ref: '#/components/parameters/profile_id'
    get:
      operationId: getProfile
      summary: Get a profile
      tags:
      - Profiles
      x-commons-tier: extended
      x-commons-share: 0.4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    delete:
      operationId: deleteProfile
      summary: Delete a profile
      tags:
      - Profiles
      x-commons-tier: extended
      x-commons-share: 0.267
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
  /cohorts:
    get:
      operationId: listCohorts
      summary: List cohorts
      tags:
      - Cohorts
      x-commons-tier: core
      x-commons-share: 1.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id003
                  $ref: '#/components/schemas/Cohort'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createCohort
      summary: Create a cohort
      tags:
      - Cohorts
      x-commons-tier: core
      x-commons-share: 0.5
